name: Fineract Build & Test - PostgreSQL
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    services:
        postgresql:
            image: postgres:17.2
            ports:
                - 5432:5432
            env:
              POSTGRES_USER: root
              POSTGRES_PASSWORD: postgres
            options: --health-cmd="pg_isready -q -d postgres -U root" --health-interval=5s --health-timeout=2s --health-retries=3
    env:
        TZ: Asia/Kolkata
        DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Setup Gradle and Validate Wrapper
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0
        with:
          validate-wrappers: true
      - name: Verify PostgreSQL connection
        run: |
            while ! pg_isready -d postgres -U root -h 127.0.0.1 -p 5432 ; do
                sleep 1
            done
      - name: Initialise databases
        run: |
            ./gradlew --no-daemon -q createPGDB -PdbName=fineract_tenants
            ./gradlew --no-daemon -q createPGDB -PdbName=fineract_default
      - name: Start LocalStack
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: localstack
          AWS_SECRET_ACCESS_KEY: localstack
          AWS_REGION: us-east-1
        run: |
          docker run -d --name localstack -p 4566:4566 -p 4510-4559:4510-4559 localstack/localstack:2.1
          sleep 10
          docker exec localstack awslocal s3api create-bucket --bucket fineract-reports
          echo "LocalStack initialization complete"
      - name: Build & Test
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: localstack
          AWS_SECRET_ACCESS_KEY: localstack
          AWS_REGION: us-east-1
          FINERACT_REPORT_EXPORT_S3_ENABLED: true
          FINERACT_REPORT_EXPORT_S3_BUCKET_NAME: fineract-reports
        run: |
            ./gradlew --no-daemon --console=plain build -x cucumber -x test -x doc
            ./gradlew --no-daemon --console=plain cucumber -x :fineract-e2e-tests-runner:cucumber
            ./gradlew --no-daemon --console=plain test -x :integration-tests:test
      - name: Run integration tests against the source-built server
        run: |
            ./gradlew --no-daemon :fineract-provider:jibDockerBuild -Djib.to.image=cba-local/fineract:ci
            docker run -d --name fineract-integration --network host \
              --env-file config/docker/env/fineract-common.env \
              --env-file config/docker/env/fineract-postgresql.env \
              -e FINERACT_HIKARI_JDBC_URL=jdbc:postgresql://localhost:5432/fineract_tenants \
              -e FINERACT_DEFAULT_TENANTDB_HOSTNAME=localhost \
              -e FINERACT_EXTERNAL_EVENTS_ENABLED=true \
              -e AWS_ENDPOINT_URL=http://localhost:4566 \
              -e AWS_ACCESS_KEY_ID=localstack -e AWS_SECRET_ACCESS_KEY=localstack \
              -e FINERACT_REPORT_EXPORT_S3_ENABLED=true \
              -e FINERACT_REPORT_EXPORT_S3_BUCKET_NAME=fineract-reports \
              cba-local/fineract:ci
            curl -kf --retry 60 --retry-all-errors --retry-delay 3 https://localhost:8443/fineract-provider/actuator/health
            ./gradlew --no-daemon :integration-tests:test -PdbType=postgresql
      - name: Print integration server logs
        if: always()
        run: docker logs fineract-integration
      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: test-results
          path: |
            build/reports/
            integration-tests/build/reports/
